# Permanent redirects from old Field Day game play URLs to Vault (player open via #play).
#
# The live fielddaylab.wisc.edu server (DoIT, Plesk) serves these folders as static files
# through nginx and ignores .htaccess, so the redirects in the root .htaccess don't apply
# there. Paste the block below into Plesk: Websites & Domains > fielddaylab.wisc.edu >
# Apache & nginx Settings > "Additional nginx directives", then Apply. If fielddaylab.org
# is a separate Plesk site, add it there too.
#
# Keep in sync with the "Old game play URLs" block in /.htaccess (used on Cloud Run).
# On hold (do NOT add yet): thermovr/ci/desktop, atom-touch/build. Vault still plays
# those from fielddaylab.

location ~ ^/play/wake/ci/production(/.*)?$ { return 301 https://vaultlearninggames.org/wake#play; }
location ~ ^/play/(bloom|zavala)/ci/production(/.*)?$ { return 301 https://vaultlearninggames.org/bloom#play; }
location ~ ^/play/(project-hercules|astrogame)/ci/production(/.*)?$ { return 301 https://vaultlearninggames.org/project-hercules#play; }
location ~ ^/play/(headlines|journalism)/ci/production(/.*)?$ { return 301 https://vaultlearninggames.org/headlines-and-high-water#play; }
location ~ ^/play/lakeland/game(/.*)?$ { return 301 https://vaultlearninggames.org/lakeland#play; }
location ~ ^/play/forevermine/game(/.*)?$ { return 301 https://vaultlearninggames.org/forever-mine#play; }
location ~ ^/play/jowilder/(game|build)(/.*)?$ { return 301 https://vaultlearninggames.org/jowilder#play; }
