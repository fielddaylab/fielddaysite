name: Field Day Site Deploy (Cloud Run)

# Builds the Dockerfile with Cloud Build and deploys it to Cloud Run.
# Kept separate from main.yml so the production rsync deploy is untouched.
on:
  workflow_dispatch:
  push:
    branches: [ staging ]

env:
  SERVICE: fielddaysite-staging

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    # Required for Workload Identity Federation (keyless auth to Google Cloud)
    permissions:
      contents: read
      id-token: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE }}
        region: ${{ vars.GCP_REGION }}
        project_id: ${{ vars.GCP_PROJECT_ID }}
        source: ./
        flags: --allow-unauthenticated --min-instances=0 --max-instances=3 --memory=512Mi

    - name: Show URL
      run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
